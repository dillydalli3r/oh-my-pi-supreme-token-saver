name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 18 is the declared engine floor; 22 catches anything that only works on an old runtime.
        node: [18, 22]
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: npm run check
      - name: Tests
        run: npm test
      - name: Installer is offline-safe
        # A dry run must be a pure preview: no network, no writes. It is the guard against an
        # installer that quietly needs GitHub to be reachable just to print what it would do.
        run: npm run dry-run
